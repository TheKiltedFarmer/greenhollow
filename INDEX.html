<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Greenhollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#101A14;--panel:#182619;--amber:#E0A63D;--parchment:#EDE6D6;--teal:#4E8B8B;--rose:#C4497B;
        --line:rgba(237,230,214,0.14);--dim:rgba(237,230,214,0.62);--soil:#5A4632;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--parchment);font-family:'Inter',sans-serif;overflow:hidden;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;background:transparent;color:var(--parchment);
         border:1px solid var(--line);padding:8px 14px;border-radius:3px;cursor:pointer;}
  button:hover{border-color:var(--amber);}
  button.primary{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:600;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);
       border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;z-index:5;}
  #hud .left{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
  #hud h1{font-size:16px;}
  .tag{font-size:11px;color:var(--amber);}
  .stam{font-size:11px;color:var(--dim);}
  .stam .pip{display:inline-block;width:7px;height:7px;border-radius:2px;margin-left:3px;background:var(--teal);}
  .stam .pip.out{background:rgba(237,230,214,0.15);}
  #hud .right{display:flex;gap:6px;}
  #hud .right button{padding:5px 9px;font-size:12px;}
  #wrap{position:relative;flex:1;overflow:hidden;background:#0A120D;}
  canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated;}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:100px;background:rgba(16,26,20,0.92);
        border:1px solid var(--amber);color:var(--amber);font-size:13px;padding:6px 14px;border-radius:20px;
        pointer-events:none;display:none;z-index:4;max-width:88%;text-align:center;}
  #toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:6px;z-index:4;}
  .slot{width:52px;height:52px;border:1px solid var(--line);border-radius:6px;background:rgba(16,26,20,0.85);
        display:flex;align-items:center;justify-content:center;position:relative;}
  .slot.sel{border-color:var(--amber);background:rgba(224,166,61,0.15);}
  .slot canvas{width:36px;height:36px;}
  .slot .n{position:absolute;bottom:1px;right:4px;font-size:10px;color:var(--dim);}
  #joy{position:absolute;left:18px;bottom:18px;width:108px;height:108px;border-radius:50%;
       border:1.5px solid rgba(237,230,214,0.25);background:rgba(24,38,25,0.4);display:none;z-index:4;}
  #stick{position:absolute;left:36px;top:36px;width:36px;height:36px;border-radius:50%;background:rgba(224,166,61,0.55);}
  #act{position:absolute;right:22px;bottom:74px;width:64px;height:64px;border-radius:50%;
       background:rgba(224,166,61,0.85);color:var(--bg);font-size:22px;font-weight:700;border:none;display:none;z-index:4;}
  #swap{position:absolute;right:26px;bottom:16px;width:52px;height:52px;border-radius:50%;
        background:rgba(78,139,139,0.8);color:var(--bg);font-size:18px;border:none;display:none;z-index:4;}
  @media (pointer:coarse){#joy,#act,#swap{display:block;}#toolbar{bottom:76px;}}
  .overlay{position:absolute;inset:0;background:rgba(10,18,13,0.9);z-index:10;display:flex;align-items:flex-start;
           justify-content:center;overflow-y:auto;padding:18px 12px 40px;}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;max-width:640px;width:100%;}
  .sub{color:var(--dim);font-size:13px;line-height:1.55;margin:8px 0 12px;}
  .note{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--amber);background:rgba(224,166,61,0.07);
        border-left:2px solid var(--amber);padding:12px 14px;margin:14px 0;line-height:1.6;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(237,230,214,0.04);
       border:1px solid var(--line);border-radius:4px;margin-bottom:7px;flex-wrap:wrap;gap:8px;}
  .hint{font-size:12px;color:var(--dim);line-height:1.6;}
  .card{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .need{border-color:var(--teal);background:rgba(78,139,139,0.07);}
  .done{opacity:.5;}
  .chat{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin:12px 0;}
  .bub{max-width:82%;padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.5;}
  .bub.them{background:rgba(237,230,214,0.06);border:1px solid var(--line);align-self:flex-start;}
  .bub.me{background:rgba(224,166,61,0.14);border:1px solid var(--amber);align-self:flex-end;}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
  .item{border:1px solid var(--line);border-radius:5px;padding:8px;display:flex;gap:8px;align-items:center;}
  .item canvas{width:34px;height:34px;image-rendering:pixelated;flex-shrink:0;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>
<div id="hud">
  <div class="left">
    <h1>Greenhollow</h1>
    <span class="tag mono" id="dayTag"></span>
    <span class="stam mono" id="stamTag"></span>
  </div>
  <div class="right">
    <button id="bagBtn">Basket</button>
    <button id="boardBtn">Board</button>
    <button id="menuBtn">Menu</button>
    <button id="sleepBtn" class="primary">Sleep</button>
  </div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hint"></div>
  <div id="toolbar"></div>
  <div id="joy"><div id="stick"></div></div>
  <button id="act">✋</button>
  <button id="swap">⇄</button>
  <div id="root"></div>
</div>
<script>
/* ================= CONFIG ================= */
const TILE=32, MW=52, MH=40, KEY='greenhollow-v1';
const DAY_START=6*60, DAY_END=24*60, MIN_PER_SEC=1/0.55;
const STAMINA=24;
const storageShim={
  async get(k){const v=localStorage.getItem(k);return v==null?null:{key:k,value:v};},
  async set(k,v){localStorage.setItem(k,v);return{key:k,value:v};}
};
const STORE=(typeof window!=='undefined'&&window.storage&&window.storage.get)?window.storage:storageShim;

/* ================= WORLD ================= */
const FARM={x:3,y:8,w:14,h:11};              /* your tillable land */
const RIVER_X=47;
const BLD={
  home:{x:4,y:3,w:5,h:4,label:'Your cottage',wall:'#5E4A3A',roof:'#8C5A3C',kind:'home'},
  barn:{x:12,y:3,w:5,h:4,label:'The old barn',wall:'#54503E',roof:'#6E6450',kind:'store'},
  seedhouse:{x:26,y:5,w:6,h:4,label:'The Seed Library',wall:'#4A5E46',roof:'#5E7A56',kind:'shop',who:'maren'},
  forge:{x:35,y:5,w:5,h:4,label:"Odell's Forge",wall:'#5A4A44',roof:'#8C5A4A',kind:'shop',who:'odell'},
  kitchen:{x:26,y:22,w:7,h:4,label:'The Long Kitchen',wall:'#5E5440',roof:'#C4A44E',kind:'shop',who:'tobias'},
  hives:{x:37,y:22,w:5,h:4,label:'Wren’s Hives',wall:'#5A5238',roof:'#C9A44E',kind:'shop',who:'wren'},
  hall:{x:20,y:13,w:7,h:5,label:'The Commons Hall',wall:'#4E5460',roof:'#6E7A8C',kind:'shop',who:'hollis'},
};
Object.keys(BLD).forEach(k=>{const b=BLD[k];b.id=k;b.door={x:b.x+Math.floor(b.w/2),y:b.y+b.h};});
const WELL={x:19,y:9};
const TABLE={x:23,y:20};                      /* the sharing table */
const TREES=[[2,2],[10,1],[19,2],[24,2],[33,2],[42,3],[45,8],[2,22],[8,24],[14,26],[20,28],[30,29],[36,30],
             [43,27],[45,18],[3,30],[11,32],[18,33],[26,34],[34,35],[41,33],[45,35],[22,7],[33,15],[43,14]];

/* ================= CROPS ================= */
const CROPS={
  turnip:{name:'Turnip',seed:'Turnip seeds',days:4,colour:'#D8CFE0',leaf:'#5E8B4E'},
  carrot:{name:'Carrot',seed:'Carrot seeds',days:5,colour:'#E08A3C',leaf:'#4E8B4E'},
  wheat :{name:'Wheat', seed:'Wheat seeds', days:5,colour:'#E0C46A',leaf:'#A8944E'},
  tomato:{name:'Tomato',seed:'Tomato seeds',days:6,colour:'#C4493C',leaf:'#4E7A46',regrow:2},
  pumpkin:{name:'Pumpkin',seed:'Pumpkin seeds',days:8,colour:'#E07A2D',leaf:'#4E7A46'},
};
const SEED_OF={};Object.keys(CROPS).forEach(k=>SEED_OF[CROPS[k].seed]=k);

/* ================= VILLAGERS ================= */
const FOLK=[
 {id:'maren',name:'Maren Ashfield',role:'Keeps the Seed Library',pal:{skin:'#E5BC96',hair:'#5A3A24',longHair:true,shirt:'#5E7A56',pants:'#3E4A38'},
  at:'seedhouse',
  intro:"Maren. I keep the seed library — everything in there was grown by somebody here and given back. Take what you'll plant.",
  lines:{work:["Sorting seed. Half of it came back from folk who grew more than they needed.","Good year for the brassicas, if the frost holds off."],
         village:["Nobody here buys anything. It confuses visitors for about a week and then it doesn't.","Hollis keeps the board. If you want to know what's needed, that's where it's written."],
         you:["You've taken over the old plot. It's good ground, it's just been lonely.","Plant something. Anything. The rest sorts itself out."]},
  likes:['Turnip','Carrot','Wheat']},
 {id:'odell',name:'Odell Frey',role:'Toolwright',pal:{skin:'#8A5A3C',hair:'#1E1A16',shirt:'#8C5A4A',pants:'#33302E',beard:true},
  at:'forge',
  intro:"Odell. I make and mend the tools. You break it, I'll fix it, and you'll bring me something when you can.",
  lines:{work:["Rehandling a scythe. Third time for this one — it refuses to die.","Quiet at the forge. That's usually a good sign for everyone else."],
         village:["Everything I make goes out into the valley and comes back as bread eventually.","Wren's honey is worth more to me than anything you could hand me for the work."],
         you:["Your hoe's soft iron. Bring me a decent haul one day and I'll draw you a better one.","Work the land first. Tools follow need, not the other way round."]},
  likes:['Wheat','Pumpkin']},
 {id:'wren',name:'Wren Calder',role:'Keeps the hives',pal:{skin:'#EDC79B',hair:'#C9A44E',pony:true,shirt:'#C9A44E',pants:'#44503E'},
  at:'hives',
  intro:"Wren. Nine hives and an orchard that's mostly opinions. If you hear humming out here, that's mine.",
  lines:{work:["The bees are calm today. You can hear it before you open anything.","Splitting a hive this week. Nervous business."],
         village:["Give the bees a flowering crop nearby and I'll give you honey until you're sick of it.","Tobias turns whatever's spare into supper. Best system anyone's come up with."],
         you:["Plant something that flowers and my girls will do half your work for you.","New hands on that plot. About time."]},
  likes:['Pumpkin','Tomato']},
 {id:'tobias',name:'Tobias Nye',role:'Cooks at the Long Kitchen',pal:{skin:'#D9A47C',hair:'#3A2A1A',shirt:'#C4A44E',pants:'#3E3A32',stubble:true},
  at:'kitchen',
  intro:"Tobias. I run the Long Kitchen — whatever comes in off the table gets cooked and whoever's hungry eats. That's the whole of it.",
  lines:{work:["Soup, mostly. Soup is what happens when everyone gives you a little of everything.","Short on anything orange this week, if you're planting."],
         village:["Leave surplus on the table by the hall. It never sits there long.","Nobody in this valley eats alone unless they want to."],
         you:["You'll be hungry by day three. Come down, there's always a pot on.","Bring me one good tomato and I'll make you regret every tomato you've had before."]},
  likes:['Tomato','Carrot','Turnip']},
 {id:'hollis',name:'Hollis Vane',role:'Keeps the Commons Hall',pal:{skin:'#E8C49B',hair:'#C8C4BC',shirt:'#6E7A8C',pants:'#3A3A42',elder:true,glasses:true},
  at:'hall',
  intro:"Hollis Vane. I keep the hall and the board on it. Anything this valley needs gets written up there, and somebody sees to it.",
  lines:{work:["Writing up what's wanted. It's mostly small things. Small things are the whole of it.","Somebody always sees to the board. I've stopped being surprised by it."],
         village:["We had coin here once. It made us worse at this, so we stopped.","Millbrook's downstream. They had a bad spring — I'd not go asking about it."],
         you:["Take what you need from the library and give back when you've got it. That's the arrangement.","Standing isn't a score. It's just people remembering you turned up."]},
  likes:['Wheat','Turnip']},
 {id:'isla',name:'Isla Frey',role:"Odell's daughter, 9",pal:{skin:'#B07B52',hair:'#241C18',pony:true,shirt:'#4E8B8B',pants:'#3A3A42',freckles:true},
  at:'hall',child:true,
  intro:"Isla! My dad's the one making all the noise. I'm not allowed in the forge but I go in anyway.",
  lines:{work:["I'm collecting frogs. There's four in the river and I've named them all.","Helping. Sort of helping. Hollis says I'm helping."],
         village:["Everyone knows everyone. It's boring but it's also quite nice.","There's a chalk cat on the hall wall. I didn't do it. A girl downstream did, ages ago."],
         you:["Is that your farm? It's all weeds. No offence.","Can I have a pumpkin when you grow one? I want the biggest."]},
  likes:['Pumpkin','Tomato']},
];

/* ================= STATE ================= */
let S=null,paused=true;
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return Math.abs(h);}
function srand(seed){const x=Math.sin(seed)*10000;return x-Math.floor(x);}

function newGame(){
  const folk={};FOLK.forEach(f=>{folk[f.id]={friend:0,met:false,askedDay:-1,asked:[],gaveDay:-1};});
  return {day:1,min:DAY_START,stam:STAMINA,runId:Date.now(),
    player:{name:'',skin:'#E8C49B',hair:'#6B4226',hairStyle:'short',top:'#4E8B8B'},
    farm:{},bag:[{item:'Turnip seeds',n:6},{item:'Carrot seeds',n:4}],
    tool:0,cans:0,folk,standing:0,needs:[],needsDay:0,shared:[],
    px:9*TILE,py:9*TILE,scene:'world',started:false};
}
async function save(){try{await STORE.set(KEY,JSON.stringify(S));}catch(e){}
  if(NET.ready()&&Date.now()-(save._t||0)>15000){save._t=Date.now();NET.pushFarm();}}
async function load(){
  try{const r=await STORE.get(KEY);
    if(r&&r.value){S=JSON.parse(r.value);
      S.farm=S.farm||{};S.bag=S.bag||[];S.folk=S.folk||{};S.needs=S.needs||[];S.shared=S.shared||[];
      FOLK.forEach(f=>{if(!S.folk[f.id])S.folk[f.id]={friend:0,met:false,askedDay:-1,asked:[],gaveDay:-1};});
      return;}}catch(e){}
  S=newGame();await save();
}


/* ============================================================
   THE SHARED VALLEY  (optional)
   Leave these blank and Greenhollow runs exactly as it does now,
   entirely on this device. Fill them in and the table, the board
   and your neighbours become real and shared.
   ============================================================ */
const SUPA_URL='';         /* e.g. https://xxxx.supabase.co   */
const SUPA_ANON='';        /* the anon/publishable key         */

const NET={
  sb:null, user:null, profile:null, on:false, peers:[], notes:[], err:'',
  ready(){return !!(this.sb&&this.user);},
  init(){
    if(!SUPA_URL||!SUPA_ANON)return false;
    if(typeof supabase==='undefined'||!supabase.createClient)return false;
    if(!this.sb)this.sb=supabase.createClient(SUPA_URL,SUPA_ANON);
    this.on=true;return true;
  },
  async restore(){
    if(!this.init())return false;
    try{
      const {data}=await this.sb.auth.getSession();
      if(data&&data.session){this.user=data.session.user;await this.afterSignIn();return true;}
    }catch(e){this.err=String(e.message||e);}
    return false;
  },
  async signIn(email){
    if(!this.init())return 'Online play is not configured in this copy.';
    try{
      const {error}=await this.sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});
      return error?error.message:'Check your email — there is a link waiting.';
    }catch(e){return String(e.message||e);}
  },
  async signOut(){ if(this.sb)await this.sb.auth.signOut(); this.user=null;this.profile=null; },
  async afterSignIn(){
    const uid=this.user.id;
    const handle=(S.player.name||'').trim()||('grower-'+uid.slice(0,4));
    await this.sb.from('profiles').upsert({id:uid,handle,look:{
      skin:S.player.skin,hair:S.player.hair,hairStyle:S.player.hairStyle,top:S.player.top},
      standing:S.standing,last_seen:new Date().toISOString()},{onConflict:'id'});
    const {data:p}=await this.sb.from('profiles').select('*').eq('id',uid).single();
    this.profile=p;
    await this.pushFarm();
    await this.pull();
  },
  async pushFarm(){
    if(!this.ready())return;
    await this.sb.from('farms').upsert({owner:this.user.id,plot:S.farm,bag:S.bag,
      px:Math.round(S.px),py:Math.round(S.py),updated_at:new Date().toISOString()},{onConflict:'owner'});
  },
  async pull(){
    if(!this.ready())return;
    const [{data:com},{data:nds},{data:pf}]=await Promise.all([
      this.sb.from('commons').select('*').order('item'),
      this.sb.from('needs').select('*').eq('day',new Date().toISOString().slice(0,10)),
      this.sb.from('profiles').select('id,handle,look,standing,last_seen').order('last_seen',{ascending:false}).limit(24),
    ]);
    this.commons=com||[];
    this.needs=nds||[];
    this.peers=(pf||[]).filter(x=>x.id!==this.user.id);
  },
  async put(item,n){ if(!this.ready())return false;
    const {error}=await this.sb.rpc('commons_put',{p_item:item,p_n:n||1});
    if(!error)await this.pull(); return !error; },
  async take(item,n){ if(!this.ready())return false;
    const {error}=await this.sb.rpc('commons_take',{p_item:item,p_n:n||1});
    if(!error)await this.pull(); return !error; },
  async fill(id){ if(!this.ready())return false;
    const {data,error}=await this.sb.rpc('need_fill',{p_id:id});
    if(!error)await this.pull(); return !error&&data; },
  async seedBoard(rows){ if(!this.ready())return;
    await this.sb.rpc('needs_roll',{p_rows:rows}); await this.pull(); },
  async visit(uid){ if(!this.ready())return null;
    const [{data:f},{data:ns}]=await Promise.all([
      this.sb.from('farms').select('*').eq('owner',uid).single(),
      this.sb.from('notes').select('id,author,body,created_at').eq('farm',uid).order('created_at',{ascending:false}).limit(12),
    ]);
    return {farm:f,notes:ns||[]}; },
  async leaveNote(uid,body){ if(!this.ready())return false;
    const {error}=await this.sb.from('notes').insert({farm:uid,author:this.user.id,body:body.slice(0,240)});
    return !error; },
};
/* what a neighbour is doing while they are away — worked out, not stored */
function neighbourDoing(peer){
  const t=new Date(), h=t.getHours();
  const seed=hash(peer.id+t.toISOString().slice(0,10));
  const away=Math.floor((Date.now()-new Date(peer.last_seen).getTime())/3600000);
  if(h<6||h>=22)return 'asleep in the cottage';
  const jobs=['watering the near rows','carrying something to the table','arguing with a gate',
              'sat on the wall by the well','pulling weeds and losing','up at the hives with Wren',
              'walking the boundary','asleep under a tree, allegedly working'];
  return jobs[seed%jobs.length]+(away>20?' — has not been seen in a while':'');
}
/* ================= BAG ================= */
function bagCount(item){const s=S.bag.find(x=>x.item===item);return s?s.n:0;}
function bagAdd(item,n){
  n=n||1;
  const s=S.bag.find(x=>x.item===item);
  if(s)s.n+=n;else S.bag.push({item,n});
  toast('＋ '+item+(n>1?(' ×'+n):''));
  updateHud();
}
function bagTake(item,n){
  n=n||1;
  const s=S.bag.find(x=>x.item===item);
  if(!s||s.n<n)return false;
  s.n-=n;if(s.n<=0)S.bag=S.bag.filter(x=>x!==s);
  updateHud();return true;
}

/* ================= FARM TILES ================= */
function key(x,y){return x+','+y;}
function inFarm(x,y){return x>=FARM.x&&x<FARM.x+FARM.w&&y>=FARM.y&&y<FARM.y+FARM.h;}
function plot(x,y){return S.farm[key(x,y)];}
function ripe(p){
  if(!p||!p.crop)return false;
  const c=CROPS[p.crop];
  return p.stage>=c.days;
}

/* ================= TOOLS ================= */
const TOOLS=[
 {id:'hoe',name:'Hoe',verb:'Till'},
 {id:'can',name:'Watering can',verb:'Water'},
 {id:'seed',name:'Seeds',verb:'Plant'},
 {id:'hand',name:'Hands',verb:'Gather'},
];
function curTool(){return TOOLS[S.tool%TOOLS.length];}
function cycleTool(d){S.tool=(S.tool+(d||1)+TOOLS.length)%TOOLS.length;drawToolbar();save();}
function selectedSeed(){
  const s=S.bag.find(x=>SEED_OF[x.item]&&x.n>0);
  return s?s.item:null;
}

/* ================= COLLISION ================= */
const blocked=new Set();
function buildCollision(){
  blocked.clear();
  const blk=(x,y)=>blocked.add(key(x,y));
  for(let y=0;y<MH;y++)for(let x=RIVER_X;x<MW;x++)blk(x,y);
  Object.values(BLD).forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)blk(x,y);});
  TREES.forEach(([x,y])=>blk(x,y));
  blk(WELL.x,WELL.y);blk(TABLE.x,TABLE.y);
  for(let x=0;x<MW;x++){blk(x,0);blk(x,MH-1);}
  for(let y=0;y<MH;y++){blk(0,y);blk(1,y);}
}

function draw(){
  ctx.fillStyle='#0A120D';ctx.fillRect(0,0,cw,ch);
  const camX=S.px-cw/(2*scale),camY=S.py-ch/(2*scale);
  ctx.save();ctx.scale(scale,scale);ctx.translate(-Math.round(camX),-Math.round(camY));
  const x0=Math.max(0,Math.floor(camX/TILE)-1),x1=Math.min(MW,Math.ceil((camX+cw/scale)/TILE)+1);
  const y0=Math.max(0,Math.floor(camY/TILE)-1),y1=Math.min(MH,Math.ceil((camY+ch/scale)/TILE)+1);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const px=x*TILE,py=y*TILE;
    if(x>=RIVER_X){
      ctx.fillStyle='#1E3450';ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#26405E';for(let i=0;i<3;i++)ctx.fillRect(px,py+((i*11+Math.floor(Date.now()/500)*4)%TILE),TILE,3);
      continue;
    }
    const road=(y>=19&&y<=20&&x>2)||(x>=18&&x<=19&&y>=6&&y<=32);
    if(road){ctx.fillStyle='#4E4432';ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='rgba(0,0,0,0.10)';ctx.fillRect(px,py,TILE,2);continue;}
    const p=plot(x,y);
    if(p&&p.till){
      ctx.fillStyle=p.wet?'#3E2F20':'#5A4632';ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='rgba(0,0,0,0.16)';for(let i=0;i<4;i++)ctx.fillRect(px,py+i*8+2,TILE,2);
      if(p.crop){
        const c=CROPS[p.crop],t=Math.min(1,p.stage/c.days);
        const h=Math.round(4+16*t);
        ctx.fillStyle=c.leaf;ctx.fillRect(px+14,py+TILE-4-h,4,h);
        ctx.fillRect(px+9,py+TILE-6-h*0.6,5,3);ctx.fillRect(px+18,py+TILE-9-h*0.5,5,3);
        if(t>=1){ctx.fillStyle=c.colour;
          if(p.crop==='wheat'){for(let i=0;i<3;i++)ctx.fillRect(px+11+i*4,py+4,3,10);}
          else{ctx.beginPath();ctx.arc(px+16,py+TILE-8-h,6,0,7);ctx.fill();}
          ctx.fillStyle='rgba(255,255,255,0.20)';ctx.fillRect(px+13,py+TILE-12-h,3,2);}
      }
      continue;
    }
    const inF=inFarm(x,y);
    ctx.fillStyle=inF?'#243A21':(((x+y)%3===0)?'#22371F':'#203519');
    ctx.fillRect(px,py,TILE,TILE);
    for(let i=0;i<7;i++){const gx=px+Math.floor(srand(hashStr('g'+x+y+i))*TILE),gy=py+Math.floor(srand(hashStr('h'+x+y+i))*TILE);
      ctx.fillStyle=i%3?'#2C482C':'#1B2E17';ctx.fillRect(gx,gy,2,3);}
    if(inF&&!p){ctx.fillStyle='rgba(224,166,61,0.05)';ctx.fillRect(px,py,TILE,TILE);}
  }
  /* well */
  ctx.fillStyle='#5A5A62';ctx.fillRect(WELL.x*TILE+4,WELL.y*TILE+8,24,20);
  ctx.fillStyle='#3A3A42';ctx.fillRect(WELL.x*TILE+8,WELL.y*TILE+12,16,12);
  ctx.fillStyle='#6A5238';ctx.fillRect(WELL.x*TILE+6,WELL.y*TILE,4,10);ctx.fillRect(WELL.x*TILE+22,WELL.y*TILE,4,10);
  ctx.fillStyle='#8C5A3C';ctx.fillRect(WELL.x*TILE+2,WELL.y*TILE-4,28,6);
  /* sharing table */
  const tx=TABLE.x*TILE,ty=TABLE.y*TILE;
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(tx+2,ty+TILE-4,TILE,6);
  ctx.fillStyle='#6A5238';ctx.fillRect(tx,ty+6,TILE,TILE-10);
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(tx,ty+6,TILE,3);
  (S.shared||[]).slice(0,4).forEach((it,i)=>{

  ctx.fillStyle='rgba(237,230,214,0.75)';ctx.font='9px Inter';ctx.textAlign='center';

    for(let i=0;i<Math.max(1,b.w-2);i++){

    const dx=b.door.x*TILE+6;
    ctx.fillStyle='#2A2118';ctx.fillRect(dx-1,by+bh-26,20,26);
    ctx.fillStyle='#43301E';ctx.fillRect(dx,by+bh-25,18,25);
    ctx.fillStyle='#E0A63D';ctx.fillRect(dx+13,by+bh-14,2,2);
    ctx.fillStyle='rgba(237,230,214,0.85)';ctx.font='10px Inter';ctx.textAlign='center';
    ctx.fillText(b.label,bx+bw/2,by-22);
  }}));
  TREES.forEach(([x,y])=>layer.push({y:(y+1)*TILE,f:()=>{
    const tx2=x*TILE,ty2=y*TILE;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(tx2+16,ty2+28,11,4,0,0,7);ctx.fill();
    ctx.fillStyle='#3A2A1A';ctx.fillRect(tx2+13,ty2+12,6,16);
    ctx.fillStyle='#1F3822';ctx.beginPath();ctx.arc(tx2+16,ty2+6,14,0,7);ctx.fill();
    ctx.fillStyle='#294A2C';ctx.beginPath();ctx.arc(tx2+11,ty2+3,9,0,7);ctx.fill();
    ctx.fillStyle='#34573A';ctx.beginPath();ctx.arc(tx2+21,ty2+2,7,0,7);ctx.fill();

  FOLK.forEach(f=>{

  });
  layer.push({y:S.py+24,f:()=>{
    const p=S.player;
    drawPerson(ctx,S.px,S.py,{skin:p.skin,hair:p.hair,longHair:p.hairStyle==='long',pony:p.hairStyle==='pony',

  layer.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  /* the tile you're about to work */

}

/* ================= VILLAGER POSITIONS ================= */

  if(h>=18&&h<21)return {x:TABLE.x+1+ (hashStr(f.id)%3), y:TABLE.y+2};

/* ================= INTERACTION ================= */
function facingTile(){
  const cxp=S.px+16,cyp=S.py+18;
  let dx=0,dy=0;
  if(pface===0)dy=-1;else if(pface===1)dy=1;else if(pface===2)dx=1;else dx=-1;
  return {x:Math.floor(cxp/TILE)+dx,y:Math.floor(cyp/TILE)+dy};
}
function nearest(){
  let best=null,bd=1.9*TILE;
  FOLK.forEach(f=>{
    const p=folkPos(f);
    const d=Math.hypot(p.x*TILE-S.px,p.y*TILE-S.py);
    if(d<bd){bd=d;best={type:'folk',f};}
  });
  const dw=Math.hypot(WELL.x*TILE-S.px,WELL.y*TILE-S.py);
  if(dw<bd){bd=dw;best={type:'well'};}
  const dt=Math.hypot(TABLE.x*TILE-S.px,TABLE.y*TILE-S.py);
  if(dt<bd){bd=dt;best={type:'table'};}
  const db=Math.hypot(BLD.hall.door.x*TILE-S.px,(BLD.hall.door.y)*TILE-S.py);
  if(db<bd){bd=db;best={type:'board'};}
  const dh=Math.hypot(BLD.home.door.x*TILE-S.px,(BLD.home.door.y)*TILE-S.py);
  if(dh<bd){bd=dh;best={type:'bed'};}
  return best;
}
function hintText(){
  const n=nearest();
  if(n){
    if(n.type==='folk')return 'Talk to '+n.f.name.split(' ')[0]+'  (E)';
    if(n.type==='well')return 'Fill the watering can  (E)';
    if(n.type==='table')return 'The sharing table  (E)';
    if(n.type==='board')return 'The needs board  (E)';
    if(n.type==='bed')return 'Turn in for the night  (E)';
  }
  const t=facingTile();const tool=curTool();
  if(tool.id==='hand'){const p=plot(t.x,t.y);if(ripe(p))return 'Harvest  (E)';return '';}
  if(!inFarm(t.x,t.y))return '';
  const p=plot(t.x,t.y);
  if(tool.id==='hoe')return p&&p.till?'':'Till the soil  (E)';
  if(tool.id==='can')return (p&&p.till&&!p.wet)?(S.cans>0?'Water  (E)':'Can is empty'):'';
  if(tool.id==='seed'){const s=selectedSeed();
    return (p&&p.till&&!p.crop&&s)?('Plant '+s+'  (E)'):'';}
  return '';
}
function spend(n){
  if(S.stam<n){toast('Too tired. Sleep to recover.');return false;}
  S.stam-=n;updateHud();return true;
}
function interact(){
  const n=nearest();
  if(n){
    if(n.type==='folk')return openTalk(n.f);
    if(n.type==='well'){S.cans=8;drawToolbar();toast('Watering can filled');save();return;}
    if(n.type==='table')return openTable();
    if(n.type==='board')return openBoard();
    if(n.type==='bed')return doSleep();
  }
  const t=facingTile(),tool=curTool();
  const p=plot(t.x,t.y);
  if(tool.id==='hand'){
    if(ripe(p)){
      const c=CROPS[p.crop];
      bagAdd(c.name,1);
      if(c.regrow){p.stage=c.days-c.regrow;p.wet=false;}
      else S.farm[key(t.x,t.y)]={till:true,wet:false};
      save();
    }
    return;
  }
  if(!inFarm(t.x,t.y))return;
  if(tool.id==='hoe'){
    if(p&&p.till)return;
    if(!spend(1))return;
    S.farm[key(t.x,t.y)]={till:true,wet:false};save();return;
  }
  if(tool.id==='can'){
    if(!p||!p.till||p.wet)return;
    if(S.cans<=0){toast('The can is empty — fill it at the well');return;}
    if(!spend(1))return;
    S.cans--;p.wet=true;drawToolbar();save();return;
  }
  if(tool.id==='seed'){
    const s=selectedSeed();
    if(!s||!p||!p.till||p.crop)return;
    if(!spend(1))return;
    if(!bagTake(s,1))return;
    p.crop=SEED_OF[s];p.stage=0;
    drawToolbar();save();return;
  }
}

/* ================= NEEDS BOARD ================= */
function rollNeeds(){
  if(S.needsDay===S.day&&S.needs.length)return;
  S.needsDay=S.day;
  const pool=[];
  FOLK.forEach(f=>f.likes.forEach(it=>pool.push({who:f.id,item:it})));
  const out=[];
  for(let i=0;i<3;i++){
    const pick=pool[hashStr('nd'+S.day+i+S.runId)%pool.length];
    if(out.some(o=>o.who===pick.who&&o.item===pick.item))continue;
    out.push({who:pick.who,item:pick.item,n:1+(hashStr('nn'+S.day+i+S.runId)%3),done:false});
  }
  S.needs=out;save();
}
function openBoard(){
  paused=true;rollNeeds();
  const rows=S.needs.map((nd,i)=>{
    const f=FOLK.find(x=>x.id===nd.who);
    const have=bagCount(nd.item);
    return '<div class="row need'+(nd.done?' done':'')+'">'
      +'<div><strong>'+esc(nd.item)+' ×'+nd.n+'</strong>'
      +'<div class="hint">for '+f.name.split(' ')[0]+' · you have '+have+'</div></div>'
      +(nd.done?'<span class="hint">seen to</span>'
        :'<button data-fill="'+i+'"'+(have>=nd.n?'':' disabled')+'>Contribute</button>')
      +'</div>';
  }).join('');
  OR('<h3>The needs board</h3>'
    +'<div class="hint" style="margin-bottom:10px;">Written up by Hollis each morning. Nothing here is bought — it is needed, and somebody sees to it.</div>'
    +rows
    +'<div class="card" style="margin-top:12px;"><strong>Standing</strong><div class="hint">'+standingWord()+' — '+S.standing+' things seen to.</div></div>'
    +'<div class="acts"><button class="primary" id="closeB">Close</button></div>');
  document.querySelectorAll('[data-fill]').forEach(b=>{b.onclick=async()=>{
    const nd=S.needs[parseInt(b.dataset.fill)];
    if(!bagTake(nd.item,nd.n))return;
    nd.done=true;S.standing++;
    const f=S.folk[nd.who];f.friend=Math.min(20,f.friend+3);
    await save();
    reward(nd.who);
    openBoard();
  };});
  document.getElementById('closeB').onclick=close;
}
function standingWord(){
  const s=S.standing;
  if(s>=18)return 'They speak of you as one of the valley';
  if(s>=10)return 'People look for you at the table';
  if(s>=4)return 'Folk have started to know your name';
  return 'Newly arrived';
}
function reward(whoId){
  const f=FOLK.find(x=>x.id===whoId);
  const r=hashStr('rw'+S.standing+S.runId)%3;
  if(whoId==='maren'||r===0){
    const seeds=Object.values(CROPS).map(c=>c.seed);
    const s=seeds[hashStr('sd'+S.standing+S.runId)%seeds.length];
    bagAdd(s,3);
    toast(f.name.split(' ')[0]+' presses seed on you');
  }else if(whoId==='wren'||r===1){
    bagAdd('Honeycomb',1);
  }else{
    bagAdd('A loaf from the kitchen',1);
  }
}

const TOPICS=[{id:'work',q:"How's the work?"},{id:'village',q:"Tell me about the valley."},{id:'you',q:"Any advice for me?"}];
function openTalk(f){
  paused=true;
  const d=S.folk[f.id];
  if(d.askedDay!==S.day){d.askedDay=S.day;d.asked=[];}
  const first=!d.met;
  if(first){d.met=true;d.friend=Math.min(20,d.friend+1);save();}
  const line=first?f.intro:null;
  const body=(msgs)=>{
    OR('<div style="display:flex;gap:12px;align-items:flex-start;">'
      +'<canvas id="pc" width="64" height="64" style="width:76px;height:76px;image-rendering:pixelated;border:1px solid var(--line);border-radius:5px;flex-shrink:0;"></canvas>'
      +'<div style="flex:1;"><h3>'+f.name+'</h3><div class="hint">'+f.role+' · '+friendWord(d.friend)+'</div></div></div>'
      +'<div class="chat" id="ch">'+msgs+'</div>'
      +'<div id="tp"></div>'
      +'<div class="acts"><button id="giveB">Give something</button><button class="primary" id="closeB">Goodbye</button></div>');
    const g=document.getElementById('pc').getContext('2d');g.imageSmoothingEnabled=false;drawPortrait(g,f.pal,2);
    renderTopics();
    document.getElementById('closeB').onclick=close;
    document.getElementById('giveB').onclick=()=>openGive(f);
  };
  const renderTopics=()=>{
    const tp=document.getElementById('tp');if(!tp)return;
    const left=TOPICS.filter(t=>d.asked.indexOf(t.id)<0);
    tp.innerHTML='<div class="hint" style="margin-bottom:6px;">'+(left.length?'Ask about…':'That is about all for today.')+'</div>'
      +TOPICS.map(t=>'<button data-t="'+t.id+'"'+(d.asked.indexOf(t.id)>=0?' disabled':'')+' style="margin:0 6px 6px 0;">'+esc(t.q)+'</button>').join('');
    tp.querySelectorAll('[data-t]').forEach(b=>{if(!b.disabled)b.onclick=()=>ask(b.dataset.t);});
  };
  let log=line?('<div class="bub them">'+esc(line)+'</div>'):'';
  const ask=(tid)=>{
    const t=TOPICS.find(x=>x.id===tid);
    d.asked.push(tid);
    d.friend=Math.min(20,d.friend+1);
    const pool=f.lines[tid];
    const say=pool[hashStr(f.id+tid+S.day+S.runId)%pool.length];
    log+='<div class="bub me">'+esc(t.q)+'</div><div class="bub them">'+esc(say)+'</div>';
    save();body(log);
    const c=document.getElementById('ch');if(c)c.scrollTop=c.scrollHeight;
  };
  body(log);
}
function friendWord(n){
  if(n>=14)return 'a real friend';
  if(n>=8)return 'friendly';
  if(n>=3)return 'warming to you';
  return 'barely knows you';
}
function openGive(f){
  paused=true;

  const mine=S.bag.filter(b=>!SEED_OF[b.item]);
  const rows=mine.map((b,i)=>'<div class="row"><div><strong>'+esc(b.item)+'</strong>'

/* ================= LOOP ================= */
let last=0,lastMin=-1;
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(!paused){
    S.min+=dt*MIN_PER_SEC;
    if(S.min>=DAY_END){doSleep();}
    let vx=0,vy=0;
    if(keys['w']||keys['arrowup'])vy-=1;
    if(keys['s']||keys['arrowdown'])vy+=1;
    if(keys['a']||keys['arrowleft'])vx-=1;
    if(keys['d']||keys['arrowright'])vx+=1;
    vx+=joyVec.x;vy+=joyVec.y;
    const m=Math.hypot(vx,vy);
    if(m>0.1){
      vx/=Math.max(1,m);vy/=Math.max(1,m);
      const sp=130*dt,HW=8,FT=17,FB=23;
      const free=(px,py)=>!blockedPx(px+16-HW,py+FT)&&!blockedPx(px+16+HW,py+FT)
        &&!blockedPx(px+16-HW,py+FB)&&!blockedPx(px+16+HW,py+FB);
      const nx=S.px+vx*sp,ny=S.py+vy*sp;
      if(free(nx,S.py))S.px=nx;
      if(free(S.px,ny))S.py=ny;
      pstep+=dt*8;
      pface=Math.abs(vx)>Math.abs(vy)?(vx>0?2:3):(vy>0?1:0);
    }
    const h=document.getElementById('hint');
    if(h.dataset.t!=='1'){
      const txt=hintText();
      if(txt){h.innerText=txt;h.style.display='block';}else h.style.display='none';
    }
    const mm=Math.floor(S.min);
    if(mm!==lastMin){lastMin=mm;updateHud();}
    draw();
  }
  requestAnimationFrame(loop);
}

/* ================= INIT ================= */
(async function(){
  try{await NET.restore();}catch(e){}

  await load();
  buildCollision();
  resize();updateHud();drawToolbar();
  if(!S.started)openIntro();else paused=false;
  requestAnimationFrame(loop);
})();
</script>
